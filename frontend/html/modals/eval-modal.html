<div class="modal-header">
    <h3>Evaluate Model</h3>
    <div class="modal-actions">
        <button class="modal-close" id="closeEvalModal">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M3.64 3.64a.5.5 0 01.71 0L8 7.29l3.65-3.65a.5.5 0 01.71.71L8.71 8l3.65 3.65a.5.5 0 01-.71.71L8 8.71l-3.65 3.65a.5.5 0 01-.71-.71L7.29 8 3.64 4.35a.5.5 0 010-.71z"/>
            </svg>
        </button>
    </div>
</div>
<div class="modal-body">
    <!-- Weight selector row -->
    <div class="eval-weight-select-row">
        <label class="property-label">Weights</label>
        <select id="evalWeightSelect" class="property-select" style="flex:1;">
            <option value="">No weights (random init)</option>
        </select>
        <button id="evalWeightRefreshBtn" class="weight-refresh-btn" title="Refresh weights list">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 3a5 5 0 0 0-4.546 2.914.5.5 0 0 1-.908-.417A6 6 0 1 1 6 13.5a.5.5 0 0 1 .096-.951A5 5 0 1 0 8 3z"/>
                <path d="M4.5 5.5a.5.5 0 0 1-.5.5H1.5a.5.5 0 0 1-.5-.5V2.5a.5.5 0 0 1 1 0v2.05a6 6 0 0 1 3.954-2.213.5.5 0 0 1 .092.999A5 5 0 0 0 4.5 5.5z"/>
            </svg>
        </button>
    </div>

    <!-- Model type badge -->
    <div style="margin-bottom:12px;">
        <span id="evalModelTypeBadge" class="eval-type-badge">Detecting model type...</span>
    </div>

    <!-- Tab bar -->
    <div class="eval-tabs" id="evalTabs">
        <button class="eval-tab active" data-eval-tab="image">Image Upload</button>
        <button class="eval-tab" data-eval-tab="tabular-csv">Tabular CSV</button>
        <button class="eval-tab" data-eval-tab="tabular-single">Tabular Single Row</button>
    </div>

    <!-- Image Upload Panel -->
    <div class="eval-tab-content active" id="evalPanelImage">
        <div class="eval-drop-zone" id="evalImageDropZone">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <div class="dataset-drop-text">Drop images here or click to browse</div>
            <div class="dataset-drop-subtext">Supports PNG, JPG, JPEG, ZIP (extracts images)</div>
            <input type="file" id="evalImageInput" accept="image/*,.zip" multiple style="display:none;">
        </div>

        <div class="eval-topk-row">
            <label class="property-label">Top-K Predictions</label>
            <input type="range" id="evalTopK" class="eval-topk-slider" min="1" max="10" value="5">
            <span id="evalTopKValue" class="eval-topk-value">5</span>
        </div>

        <button class="btn btn-primary" id="evalImageRunBtn" style="width:100%;margin-top:12px;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M11.251.068a.5.5 0 01.227.58L9.677 6.5H13a.5.5 0 01.364.843l-8 8.5a.5.5 0 01-.842-.49L6.323 9.5H3a.5.5 0 01-.364-.843l8-8.5a.5.5 0 01.615-.09z"/>
            </svg>
            Run Evaluation
        </button>

        <div class="eval-image-strip" id="evalImageStrip" style="display:none;"></div>

        <div class="eval-results" id="evalImageResults" style="display:none;">
            <h4 class="eval-result-header">Predictions</h4>
            <div class="eval-prediction-grid" id="evalImagePredGrid"></div>
        </div>
    </div>

    <!-- Tabular CSV Panel -->
    <div class="eval-tab-content" id="evalPanelTabularCsv">
        <div class="eval-drop-zone" id="evalCsvDropZone">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <div class="dataset-drop-text">Drop CSV file here or click to browse</div>
            <div class="dataset-drop-subtext">Supports .csv files</div>
            <input type="file" id="evalCsvInput" accept=".csv" style="display:none;">
        </div>

        <button class="btn btn-primary" id="evalCsvRunBtn" style="width:100%;margin-top:12px;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M11.251.068a.5.5 0 01.227.58L9.677 6.5H13a.5.5 0 01.364.843l-8 8.5a.5.5 0 01-.842-.49L6.323 9.5H3a.5.5 0 01-.364-.843l8-8.5a.5.5 0 01.615-.09z"/>
            </svg>
            Run Evaluation
        </button>

        <button class="btn btn-primary" id="evalCsvDownloadBtn" style="width:100%;margin-top:8px;display:none;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M.5 9.9a.5.5 0 01.5.5v2.5a1 1 0 001 1h12a1 1 0 001-1v-2.5a.5.5 0 011 0v2.5a2 2 0 01-2 2H2a2 2 0 01-2-2v-2.5a.5.5 0 01.5-.5z"/>
                <path d="M7.646 11.854a.5.5 0 00.708 0l3-3a.5.5 0 00-.708-.708L8.5 10.293V1.5a.5.5 0 00-1 0v8.793L5.354 8.146a.5.5 0 10-.708.708l3 3z"/>
            </svg>
            Download Results CSV
        </button>

        <div class="eval-csv-preview" id="evalCsvResults" style="display:none;">
            <h4 class="eval-result-header">Results Preview</h4>
            <div id="evalCsvPreviewTable"></div>
        </div>
    </div>

    <!-- Tabular Single Row Panel -->
    <div class="eval-tab-content" id="evalPanelTabularSingle">
        <div id="evalSingleRowForm" class="eval-single-form">
            <p class="eval-no-data">Loading feature fields...</p>
        </div>

        <button class="btn btn-primary" id="evalSingleRunBtn" style="width:100%;margin-top:12px;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M11.251.068a.5.5 0 01.227.58L9.677 6.5H13a.5.5 0 01.364.843l-8 8.5a.5.5 0 01-.842-.49L6.323 9.5H3a.5.5 0 01-.364-.843l8-8.5a.5.5 0 01.615-.09z"/>
            </svg>
            Run Evaluation
        </button>

        <div class="eval-results" id="evalSingleResults" style="display:none;">
            <h4 class="eval-result-header">Prediction</h4>
            <div id="evalSinglePredResult"></div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div class="eval-loading" id="evalLoading" style="display:none;">
        <div class="eval-loading-spinner"></div>
        <div class="eval-loading-text">Evaluating...</div>
    </div>
</div>
